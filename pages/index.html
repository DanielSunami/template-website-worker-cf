<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEU SITE</title>
  <meta name="description" content="" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <!-- CRIE AQUI SEU HTML, ONDE HOUVER FORM UTILIZE TURNSTILE -->
  <!-- exemplo form -->
  <form id="form-contato">
    <label>Nome
      <input name="name" required maxlength="120" autocomplete="name" />
    </label>
    <label>E-mail
      <input name="email" type="email" required maxlength="160" autocomplete="email" />
    </label>
    <label>Telefone
      <input name="phone" type="tel" inputmode="numeric" maxlength="16" autocomplete="tel" placeholder="(11) 99999-9999" />
    </label>
    <label>Assunto
      <select name="subject">
        <option value="Divórcio">Divórcio</option>
        <option value="Herança e inventário">Herança e inventário</option>
        <option value="Guarda e pensão">Guarda e pensão</option>
        <option value="União estável">União estável</option>
        <option value="Outro">Outro</option>
      </select>
    </label>
    <label>Mensagem
      <textarea name="body" required maxlength="4000" placeholder="Em poucas linhas: o que aconteceu e o que você precisa."></textarea>
    </label>
    <label hidden>Website
      <input name="website" tabindex="-1" autocomplete="off" />
    </label>
    <div class="cf-turnstile" data-sitekey=""></div>
    <button class="btn-enviar" type="submit">Enviar</button>
    <p id="form-status" role="status"></p>
  </form>
  <div id="form-ok" hidden>Mensagem enviada.</div>
  <script type="module" src="/js/contato.js"></script>
</body>
</html>
